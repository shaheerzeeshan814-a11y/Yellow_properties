<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yellow Properties | Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #fff;
      min-height: 100vh;
    }

    .topbar {
      height: 72px;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 35px;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #f4c400;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
    }

    .brand-name {
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logout-btn {
      border: 1px solid #333;
      background: transparent;
      color: #ddd;
      padding: 10px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }

    .logout-btn:hover {
      border-color: #f4c400;
      color: #f4c400;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 45px 25px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
    }

    .eyebrow {
      color: #f4c400;
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
    }

    .add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f4c400;
      color: #111;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .add-btn:hover {
      background: #ffd92e;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 40px;
    }

    .stat {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 25px;
    }

    .stat-label {
      color: #888;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: 800;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .properties {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .property {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
      overflow: hidden;
    }

    .property-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .property-content {
      padding: 20px;
    }

    .property-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .property-location {
      color: #999;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .property-price {
      color: #f4c400;
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 15px;
    }

    .property-actions {
      display: flex;
      gap: 8px;
    }

    .delete-btn {
      border: 1px solid #4a2929;
      background: #211414;
      color: #ff7070;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #321818;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 70px 20px;
      border: 1px dashed #333;
      border-radius: 15px;
      color: #777;
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px;
      color: #888;
    }

    .error {
      grid-column: 1 / -1;
      background: #241515;
      border: 1px solid #4c2525;
      color: #ff8a8a;
      padding: 18px;
      border-radius: 12px;
    }

    @media (max-width: 900px) {
      .properties {
        grid-template-columns: repeat(2, 1fr);
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 0 18px;
      }

      .container {
        padding: 30px 18px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      h1 {
        font-size: 30px;
      }

      .properties,
      .stats {
        grid-template-columns: 1fr;
      }

      .add-btn {
        width: 100%;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/dashboard-CUZ6YiIk.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>

<body>

  <header class="topbar">

    <div class="brand">

      <div class="logo">
        Y
      </div>

      <div class="brand-name">
        YELLOW PROPERTIES
      </div>

    </div>

    <button
      id="logoutBtn"
      class="logout-btn"
    >
      Logout
    </button>

  </header>


  <main class="container">

    <div class="header">

      <div>

        <div class="eyebrow">
          ADMIN PANEL
        </div>

        <h1>
          Property Dashboard
        </h1>

        <p class="subtitle">
          Manage your Yellow Properties listings.
        </p>

      </div>

      <a
        href="./add-property.html"
        class="add-btn"
      >
        + Add Property
      </a>

    </div>


    <section class="stats">

      <div class="stat">

        <div class="stat-label">
          TOTAL PROPERTIES
        </div>

        <div
          class="stat-number"
          id="totalProperties"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          AVAILABLE
        </div>

        <div
          class="stat-number"
          id="availableProperties"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          SOLD
        </div>

        <div
          class="stat-number"
          id="soldProperties"
        >
          0
        </div>

      </div>

    </section>


    <h2 class="section-title">
      Your Properties
    </h2>


    <section
      id="properties"
      class="properties"
    >

      <div class="loading">
        Loading properties...
      </div>

    </section>

  </main>



</body>

</html>
