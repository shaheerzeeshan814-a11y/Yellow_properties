<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Yellow Properties — Admin</title>


  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 40px;
      box-sizing: border-box;
      background: #151515;
      border: 1px solid #303030;
      border-radius: 22px;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }

    .login-logo {
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      border-radius: 14px;
      background: #f4c400;
      color: #111;
      font-size: 27px;
      font-weight: 900;
    }

    .login-header span {
      color: #f4c400;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .login-header h1 {
      margin: 8px 0;
      font-size: 34px;
    }

    .login-header p {
      margin: 0 0 30px;
      color: #999;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      background: #0d0d0d;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #f4c400;
    }

    #loginButton {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #f4c400;
      color: #111;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    #loginButton:hover {
      background: #ffd52a;
    }

    #loginButton:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .login-message {
      min-height: 22px;
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .login-message.error {
      color: #ff6565;
    }

    .login-message.success {
      color: #50d890;
    }
  </style>
  <script type="module" crossorigin src="/assets/login-NuJKfi1D.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/login-DbbDtJTu.css">
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-logo">
        Y
      </div>

      <div class="login-header">
        <span>YELLOW PROPERTIES</span>

        <h1>Admin Login</h1>

        <p>
          Sign in to manage your property listings.
        </p>
      </div>

      <form id="loginForm">

        <div class="input-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="Enter admin email"
            autocomplete="email"
            required
          >

        </div>

        <div class="input-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >

        </div>

        <button
          id="loginButton"
          type="submit"
        >
          <span id="loginText">
            Login
          </span>
        </button>

        <div
          id="loginMessage"
          class="login-message"
        ></div>

      </form>

    </section>

  </main>


</body>

</html>
